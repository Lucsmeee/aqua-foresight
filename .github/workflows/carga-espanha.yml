name: Carga Espanha (Júcar)

# Execução manual: reservas semanais do MITECO (desde 1988) e informes mensais da CHJ (2019+).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-espanha
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e .
          sudo apt-get install -y -qq mdbtools > /dev/null
      - name: MITECO e CHJ
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from aqua_foresight import espanha
          pasta = Path("data/series")
          print(espanha.atualizar_miteco(pasta, forcar=True))
          hoje = date.today()
          meses = [f"{a % 100:02d}{m:02d}" for a in range(2019, hoje.year + 1) for m in (2, 8)]
          meses += espanha._meses_anteriores(hoje, 4)
          print(espanha.atualizar_chj(pasta, sorted(set(meses))))
          PY
      - name: Versionar dados
        if: always()
        run: |
          git config user.name "aqua-foresight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series/es_*
          if git diff --cached --quiet; then echo "Nada novo."; else
            git commit -m "dados: Espanha · Júcar (MITECO e CHJ) $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
