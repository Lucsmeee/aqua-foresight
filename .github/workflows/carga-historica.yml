name: Carga histórica

# Execução manual. Baixa a série diária do SAR/ANA (DF) e o RONI, e versiona os dados.
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial (AAAA-MM-DD)"
        default: "1990-01-01"
      max_dias:
        description: "Máximo de dias consultados nesta execução"
        default: "20000"

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e .
          sudo apt-get install -y -qq mdbtools > /dev/null
      - name: RONI (NOAA/CPC)
        run: aqua publicar --saida /tmp/site
      - name: SAR/ANA diário
        run: python scripts/carga_historica_sar.py --inicio "${{ github.event.inputs.inicio }}" --max-dias "${{ github.event.inputs.max_dias }}"
      - name: Espanha · Júcar (MITECO e informes da CHJ)
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from aqua_foresight import espanha
          pasta = Path("data/series")
          print(espanha.atualizar_miteco(pasta, forcar=True))
          hoje = date.today()
          meses = [f"{a % 100:02d}{m:02d}" for a in range(2019, hoje.year + 1) for m in (2, 8)]
          meses += espanha._meses_anteriores(hoje, 4)
          print(espanha.atualizar_chj(pasta, sorted(set(meses))))
          PY
      - name: Versionar dados
        if: always()
        run: |
          git config user.name "aqua-foresight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/series
          if git diff --cached --quiet; then echo "Nada novo."; else
            git commit -m "dados: carga histórica SAR/ANA e RONI $(date -u +%Y-%m-%d)"
            git pull --rebase origin main && git push
          fi
