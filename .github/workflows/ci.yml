name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aqua_test
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua_test"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Testes (SQLite)
        run: pytest
      - name: Testes (PostgreSQL/PostGIS)
        env:
          AQUA_TEST_DATABASE_URL: postgresql+psycopg://aqua:aqua_ci@localhost:5432/aqua_test
        run: pytest
