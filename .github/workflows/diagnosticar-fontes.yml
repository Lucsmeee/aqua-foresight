name: Diagnosticar fontes

# Execução manual: testa acesso e formato das fontes externas antes de codificar adaptadores.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço (vazio = lista padrão)"
        required: false
        default: ""
      paginas:
        description: "Páginas de PDF a mostrar (ex.: 10-14)"
        required: false
        default: "1-12"

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install httpx pypdf
          sudo apt-get install -y -qq mdbtools > /dev/null
      - name: Diagnóstico
        env:
          URLS: ${{ github.event.inputs.urls }}
          DIAG_PAGINAS: ${{ github.event.inputs.paginas }}
          DIAG_MAX_CHARS: "20000"
        run: python scripts/diagnosticar_fontes.py $URLS
