[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-foresight"
version = "0.3.1"
description = "Aqua Foresight — apoio à decisão para risco de escassez hídrica (DF/Descoberto e Santa Maria), ENOS e regras jurídicas auditáveis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "A definir" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aqua = "aqua_foresight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
